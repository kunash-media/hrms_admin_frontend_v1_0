<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Pay-Slips</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- html2pdf library for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        :root {
            --primary: #1B738C;
            --primary-light: #62C9EA;
            --primary-soft: #BDE4EE;
            --primary-bg-light: #e9f2f4;
            --button-hover: #166278;
            --border-color: #1B738C;
            --text-dark: #1B738C;
            --text-light: #5a7c8a;
        }


        body {
            background-color: #EBF4F6;
        }
       
        .section-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #49abcb;
            padding: 20px;
            margin-bottom: 20px;
        }

        .btn-primary {
            background-color: #1B738C;
            transition: all 0.3s ease;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            background-color: #18657a;
            transform: translateY(-1px);
        }

        .btn-outline {
            border: 1px solid #7fd8f0;
            color: #1B738C;
            padding: 8px 16px;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
        }

        .btn-outline:hover {
            background-color: #1B738C;
            color: white;
        }

        .btn-success {
            background-color: #28a745;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        input,
        select {
            border: 1px solid #c99ebb;
            border-radius: 8px;
            padding: 8px 12px;
            width: 100%;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1B738C;
            box-shadow: 0 0 0 2px rgba(27, 115, 140, 0.1);
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: #1B738C;
            margin-bottom: 4px;
            display: block;
        }

        .submodule-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #a3d9ec;
            flex-wrap: wrap;
        }

        .submodule-link {
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            background: transparent;
            color: #1B738C;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .submodule-link:hover {
            background-color: rgba(27, 115, 140, 0.1);
            color: #1B738C;
        }

        .submodule-link.active {
            background-color: #1B738C;
            color: white;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            color: white;
            z-index: 1100;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background-color: #28a745;
        }

        .toast.error {
            background-color: #dc3545;
        }

        .toast.info {
            background-color: #17a2b8;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .main-content {
            margin-top: 64px;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f3eeef;
        }

        ::-webkit-scrollbar-thumb {
            background: #92487A;
            border-radius: 10px;
        }

        .payslip-card {
            background: white;
            border: 1px solid #56afc8;
            border-radius: 12px;
            padding: 16px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .payslip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(27, 115, 140, 0.1);
        }

        /* ─── Payslip Slip Styles (Excel sheet structure) ─── */
        .payslip-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 24px 28px;
            font-size: 12.5px;
            color: #111;
        }

        .ps-header {
            border: 2px solid #1B738C;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .ps-company-row {
            background: #1B738C;
            color: white;
            text-align: center;
            padding: 10px 16px;
        }

        .ps-company-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .ps-company-addr {
            font-size: 11px;
            opacity: 0.88;
            margin-top: 3px;
        }

        .ps-month-row {
            text-align: center;
            padding: 6px;
            font-weight: 600;
            font-size: 12.5px;
            color: #1B738C;
            background: #e9f6fb;
            border-top: 1px solid #62C9EA;
        }

        .ps-emp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 1px solid #1B738C;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .ps-emp-cell {
            display: flex;
            gap: 8px;
            padding: 6px 12px;
            border-bottom: 1px solid #d4edf5;
        }

        .ps-emp-cell:nth-child(odd) {
            border-right: 1px solid #d4edf5;
        }

        .ps-emp-cell:nth-last-child(1),
        .ps-emp-cell:nth-last-child(2) {
            border-bottom: none;
        }

        .ps-emp-label {
            color: #1B738C;
            font-weight: 600;
            min-width: 115px;
            font-size: 11.5px;
            flex-shrink: 0;
        }

        .ps-emp-value {
            color: #222;
            font-size: 11.5px;
        }

        .ps-salary-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #1B738C;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .ps-salary-table thead tr th {
            background: #1B738C;
            color: white;
            padding: 7px 12px;
            font-size: 12px;
            text-align: left;
            font-weight: 600;
        }

        .ps-salary-table thead tr th.amt-col {
            text-align: right;
        }

        .ps-salary-table tbody tr td {
            padding: 6px 12px;
            font-size: 12px;
            border-bottom: 1px solid #e4f3f8;
            vertical-align: middle;
        }

        .ps-salary-table tbody tr:last-child td {
            border-bottom: none;
        }

        .ps-salary-table tbody tr td.amt-col {
            text-align: right;
        }

        .ps-salary-table tbody tr.total-row td {
            font-weight: 700;
            background: #e9f6fb;
            border-top: 2px solid #1B738C;
            border-bottom: none;
        }

        .ps-net-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1B738C;
            color: white;
            border-radius: 6px;
            padding: 10px 16px;
            margin-bottom: 10px;
        }

        .ps-net-label {
            font-size: 13px;
            font-weight: 600;
        }

        .ps-net-words {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 3px;
        }

        .ps-net-amount {
            font-size: 22px;
            font-weight: 800;
        }

        .ps-footer {
            text-align: center;
            font-size: 10px;
            color: #888;
            padding-top: 10px;
            border-top: 1px solid #e0f0f7;
            margin-top: 6px;
        }

        /* disabled select */
        select:disabled {
            background: #f5f8fa;
            color: #999;
            cursor: not-allowed;
        }

        /* month input colour */
        input[type="month"] {
            color: #1B738C;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            width: 90%;
            max-width: 700px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .section-card {
                padding: 16px;
            }

            .submodule-link {
                padding: 6px 12px;
                font-size: 12px;
            }

            .modal-content {
                padding: 16px;
            }

            .ps-emp-grid {
                grid-template-columns: 1fr;
            }

            .ps-emp-cell:nth-child(odd) {
                border-right: none;
            }
        }
    </style>
</head>

<body>

    <div class="flex h-screen overflow-hidden">
        <div id="sidebar-container"></div>

        <div class="flex-1 flex flex-col overflow-hidden">
            <div id="header-container"></div>

            <main class="flex-1 overflow-y-auto p-5 main-content">

                <!-- Page Header -->
                <div class="mb-6">
                   <h1 class="text-2xl font-bold text-[var(--primary)]">Payroll Management</h1>
                    <p class="text-sm text-[#1B738C] mt-1">Manage salary structures &amp; process employee payroll.</p>
                 </div>
           

                <!-- Sub Navigation -->
                <div class="flex gap-2 pb-4 border-b border-[#62C9EA] mb-6 flex-wrap">
                    <a href="employee_payroll.html" class="submodule-link px-6 py-2 rounded-lg text-sm font-medium">Salary Structure</a>
                    <a href="#" class="submodule-link active px-6 py-2 rounded-lg text-sm font-medium">Payslips</a>
                </div>

                <!-- Filters -->
                <div class="section-card mb-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">

                        <!-- Month: dynamic date picker instead of hardcoded options -->
                        <div>
                            <label class="text-xs font-semibold text-[var(--primary)]">Select Month</label>
                            <input type="month" id="payslipMonth" onchange="filterPayslips()"
                                   class="w-full px-4 py-2.5 border border-[#62C9EA] rounded-lg text-sm focus:outline-none">
                        </div>

                        <!-- Department: API-driven with fallback -->
                        <div>
                            <label class="text-xs font-semibold text-[var(--primary)]">Select Department</label>
                            <select id="payslipDepartment" onchange="onDepartmentChange()"
                                    class="w-full px-4 py-2.5 border border-[#62C9EA] rounded-lg text-sm focus:outline-none">
                                <option value="">-- Select Department --</option>
                            </select>
                        </div>

                        <!-- Employee: populated after department selected -->
                        <div>
                            <label class="text-xs font-semibold text-[var(--primary)]">Select Employee</label>
                            <select id="payslipEmployee" onchange="filterPayslips()" disabled
                                    class="w-full px-4 py-2.5 border border-[#62C9EA] rounded-lg text-sm focus:outline-none">
                                <option value="all">All Employees</option>
                            </select>
                        </div>

                        <!-- Search -->
                        <div>
                            <label class="text-xs font-semibold text-[var(--primary)]">Search</label>
                            <input type="text" id="payslipSearch" placeholder="Search by name..." 
                                   onkeyup="filterPayslips()"
                                   class="w-full px-4 py-2.5 border border-[#62C9EA] rounded-lg text-sm focus:outline-none">
                        </div>

                    </div>
                </div>

                <!-- Payslips Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" id="payslipsGrid">
                    <!-- Dynamically populated by JavaScript -->
                </div>

            </main>
        </div>
    </div>

    <!-- Payslip Modal -->
    <div id="payslipModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-semibold text-[var(--primary)]">Salary Slip</h3>
                <button onclick="closePayslipModal()" 
                        class="text-3xl leading-none text-gray-400 hover:text-[var(--primary)] transition-colors">
                    &times;
                </button>
            </div>
            
            <div id="payslipContent" class="mb-6"></div>

            <div class="flex justify-end gap-3">
                <button onclick="downloadPayslipPDF()" 
                        class="btn-primary flex items-center gap-2 px-6 py-2.5 text-sm font-medium">
                    <i class="fas fa-download"></i> 
                    Download PDF
                </button>
                <button onclick="printPayslip()" 
                        class="btn-outline flex items-center gap-2 px-6 py-2.5 text-sm font-medium">
                    <i class="fas fa-print"></i> 
                    Print
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts — original references kept intact -->
    <script src="../../assets/js/common.js"></script>
    <script src="../../assets/js/sidebar.js"></script>
    <script src="../../assets/js/header.js"></script>

    <script>

        const BASE_URL = 'http://localhost:8086';
        const FALLBACK_DEPARTMENTS = ['Human Resources', 'IT', 'Sales'];

        // ── 2 dummy entries (matching Excel sheet structure) for UI preview ──
        const dummyEmployees = [
            {
                id: 'EMP/SIEC/001',
                name: 'Amit Gandhe',
                emp_code: 'EMP/SIEC/001',
                designation: 'CEO',
                department: 'Management',
                doj: '14-FEB-2023',
                total_working_days: 30,
                lwp: 0,
                days_paid: 30,
                basic: 100000,
                da: 15000,
                hra: 40000,
                other_allowance: 30620.35,
                reimbursement: 52000,
                pf: 1800,
                pt: 200,
                esic: 0,
                tds: 35600
            },
            {
                id: 'EMP/SIEC/002',
                name: 'Priya Sharma',
                emp_code: 'EMP/SIEC/002',
                designation: 'HR Manager',
                department: 'Human Resources',
                doj: '10-JUN-2021',
                total_working_days: 30,
                lwp: 1,
                days_paid: 29,
                basic: 45000,
                da: 6000,
                hra: 18000,
                other_allowance: 8500,
                reimbursement: 5000,
                pf: 1800,
                pt: 200,
                esic: 0,
                tds: 4200
            }
        ];

        let employeeList    = [];
        let currentPayslipData = null;

        // ── Init ────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            loadSidebar();
            loadHeader();

            // Set month picker to current month (YYYY-MM)
            const now = new Date();
            document.getElementById('payslipMonth').value =
                `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;

            loadDepartments();

            // Show dummy cards on page load so layout is visible
            employeeList = dummyEmployees;
            generatePayslipCards();
        });

        // ── Load departments from API; fall back to static list ─────────────
        async function loadDepartments() {
            let depts = [];
            try {
                const res = await fetch(`${BASE_URL}/api/department-list`);
                if (!res.ok) throw new Error('non-2xx');
                depts = await res.json();
                if (!Array.isArray(depts) || depts.length === 0) throw new Error('empty');
            } catch {
                depts = FALLBACK_DEPARTMENTS;
                showToast('Using fallback department list.', 'info');
            }

            const sel = document.getElementById('payslipDepartment');
            sel.innerHTML = '<option value="">-- Select Department --</option>';
            depts.forEach(d => {
                const label = typeof d === 'object'
                    ? (d.name || d.department_name || d.dept_name || '')
                    : d;
                sel.innerHTML += `<option value="${label}">${label}</option>`;
            });
        }

        // ── Department change → fetch employee list ─────────────────────────
        async function onDepartmentChange() {
            const dept   = document.getElementById('payslipDepartment').value;
            const empSel = document.getElementById('payslipEmployee');

            // Reset
            empSel.innerHTML = '<option value="all">All Employees</option>';
            empSel.disabled  = true;

            if (!dept) {
                employeeList = dummyEmployees;
                generatePayslipCards();
                return;
            }

            try {
                const res = await fetch(
                    `${BASE_URL}/api/employees/payroll-list?department=${encodeURIComponent(dept)}`
                );
                if (!res.ok) throw new Error('non-2xx');
                const data = await res.json();
                employeeList = Array.isArray(data) ? data : [];
            } catch {
                showToast('Could not load employees. Showing demo data.', 'error');
                employeeList = dummyEmployees;
            }

            // Populate employee dropdown
            employeeList.forEach(emp => {
                const name = emp.name || emp.employee_name ||
                    `${emp.first_name ?? ''} ${emp.last_name ?? ''}`.trim();
                const id   = emp.id ?? name;
                empSel.innerHTML += `<option value="${id}">${name}</option>`;
            });
            empSel.disabled = false;

            generatePayslipCards();
        }

        // ── Render payslip cards (same flow as original) ────────────────────
        function generatePayslipCards() {
            const grid  = document.getElementById('payslipsGrid');
            const month = getSelectedMonthLabel();
            grid.innerHTML = '';

            if (!employeeList || employeeList.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center text-gray-400 py-16">
                        <i class="fas fa-file-invoice-dollar text-4xl mb-3 block opacity-30"></i>
                        <p class="text-sm">No payslips found.</p>
                    </div>`;
                return;
            }

            employeeList.forEach(emp => {
                const name  = emp.name || emp.employee_name ||
                    `${emp.first_name ?? ''} ${emp.last_name ?? ''}`.trim();
                const id    = String(emp.id ?? name);
                const desig = emp.designation || emp.position || '—';
                const dept  = emp.department  || emp.dept     || '—';
                const net   = computeNet(emp);

                grid.innerHTML += `
                    <div class="payslip-card" data-name="${name.toLowerCase()}" data-id="${id}"
                         onclick="viewPayslip('${id}')">
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="w-10 h-10 rounded-full bg-[#1B738C]/10 flex items-center justify-center">
                                    <i class="fas fa-user text-[#1B738C]"></i>
                                </div>
                                <h4 class="font-semibold mt-3 text-[var(--primary)]">${name}</h4>
                                <p class="text-xs text-gray-500">${desig} • ${dept}</p>
                            </div>
                            <i class="fas fa-download text-[var(--primary)] text-xl"></i>
                        </div>
                        <div class="mt-4 pt-3 border-t border-[#7fcde3] flex justify-between items-end">
                            <span class="text-xs text-gray-500">${month}</span>
                            <span class="text-lg font-bold text-green-600">
                                ${net !== null ? '₹' + net.toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '—'}
                            </span>
                        </div>
                    </div>`;
            });
        }

        // ── Compute net pay ─────────────────────────────────────────────────
        function computeNet(emp) {
            if (emp.net_pay != null) return parseFloat(emp.net_pay);
            if (emp.net     != null) return parseFloat(emp.net);
            const gross  = (parseFloat(emp.basic) || 0) + (parseFloat(emp.da) || 0) +
                           (parseFloat(emp.hra)   || 0) +
                           (parseFloat(emp.other_allowance || emp.otherAllow) || 0) +
                           (parseFloat(emp.reimbursement) || 0);
            const deduct = (parseFloat(emp.pf) || 0) + (parseFloat(emp.pt) || 0) +
                           (parseFloat(emp.esic) || 0) + (parseFloat(emp.tds) || 0);
            return gross > 0 ? gross - deduct : null;
        }

        // ── View payslip → open modal ───────────────────────────────────────
        function viewPayslip(empId) {
            const emp = employeeList.find(e => String(e.id ?? e.name) === empId);
            if (!emp) { showToast('Employee data not found.', 'error'); return; }

            const name     = emp.name || emp.employee_name ||
                             `${emp.first_name ?? ''} ${emp.last_name ?? ''}`.trim();
            const month    = getSelectedMonthLabel();
            const monthRaw = document.getElementById('payslipMonth').value;

            // Earnings
            const basic      = parseFloat(emp.basic)                                    || 0;
            const da         = parseFloat(emp.da)                                        || 0;
            const hra        = parseFloat(emp.hra)                                       || 0;
            const otherAllow = parseFloat(emp.other_allowance || emp.otherAllow)         || 0;
            const reimburse  = parseFloat(emp.reimbursement)                             || 0;

            // Deductions
            const pf   = parseFloat(emp.pf)   || 0;
            const pt   = parseFloat(emp.pt)   || 0;
            const esic = parseFloat(emp.esic) || 0;
            const tds  = parseFloat(emp.tds)  || 0;

            const grossEarnings   = basic + da + hra + otherAllow + reimburse;
            const totalDeductions = pf + pt + esic + tds;
            const netPay = parseFloat(emp.net_pay || emp.net) || (grossEarnings - totalDeductions);
            const amtWords = numberToWords(Math.round(netPay));

            const totalDays = emp.total_working_days || emp.working_days || 30;
            const lwp       = emp.lwp || emp.absent || 0;
            const daysPaid  = emp.days_paid || (totalDays - lwp);

            currentPayslipData = { name, month, monthRaw, netPay };

            const fmt = n => n ? parseFloat(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }) : '—';

            const content = `
                <div id="payslipToPrint" class="payslip-container">

                    <!-- Company Header (matching Excel) -->
                    <div class="ps-header">
                        <div class="ps-company-row">
                            <div class="ps-company-name">
                                Sustainable Integrated Environmental Consultant.
                            </div>
                            <div class="ps-company-addr">
                                Office-401, Sanskriti Arcade, Kaspate Wasti, Wakad, Pune - 411057
                            </div>
                        </div>
                        <div class="ps-month-row">PAYSLIP FOR THE MONTH OF ${month.toUpperCase()}</div>
                    </div>

                    <!-- Employee Details (matches Excel rows 9-12) -->
                    <div class="ps-emp-grid">
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">Name</span>
                            <span class="ps-emp-value">${name}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">Total Working Days</span>
                            <span class="ps-emp-value">${totalDays}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">Emp. Code</span>
                            <span class="ps-emp-value">${emp.emp_code || emp.employee_code || emp.id || '—'}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">LWP / Absent</span>
                            <span class="ps-emp-value">${lwp || '—'}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">DOJ</span>
                            <span class="ps-emp-value">${emp.doj || emp.joining_date || emp.joiningDate || '—'}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">Days Paid</span>
                            <span class="ps-emp-value">${daysPaid}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">Designation</span>
                            <span class="ps-emp-value">${emp.designation || emp.position || '—'}</span>
                        </div>
                        <div class="ps-emp-cell">
                            <span class="ps-emp-label">Department</span>
                            <span class="ps-emp-value">${emp.department || emp.dept || '—'}</span>
                        </div>
                    </div>

                    <!-- Earnings & Deductions (matches Excel rows 14-23) -->
                    <table class="ps-salary-table">
                        <thead>
                            <tr>
                                <th style="width:36%">Earnings</th>
                                <th class="amt-col" style="width:14%">Amount (₹)</th>
                                <th style="width:36%">Deductions</th>
                                <th class="amt-col" style="width:14%">Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Basic</td>
                                <td class="amt-col">${fmt(basic)}</td>
                                <td>PF</td>
                                <td class="amt-col">${fmt(pf)}</td>
                            </tr>
                            <tr>
                                <td>DA</td>
                                <td class="amt-col">${fmt(da)}</td>
                                <td>PT</td>
                                <td class="amt-col">${fmt(pt)}</td>
                            </tr>
                            <tr>
                                <td>HRA</td>
                                <td class="amt-col">${fmt(hra)}</td>
                                <td>ESIC</td>
                                <td class="amt-col">${esic ? fmt(esic) : '—'}</td>
                            </tr>
                            <tr>
                                <td>Other Allowance</td>
                                <td class="amt-col">${fmt(otherAllow)}</td>
                                <td>TDS / IT Return</td>
                                <td class="amt-col">${fmt(tds)}</td>
                            </tr>
                            <tr>
                                <td>Reimbursement</td>
                                <td class="amt-col">${reimburse ? fmt(reimburse) : '—'}</td>
                                <td></td>
                                <td></td>
                            </tr>
                            <tr class="total-row">
                                <td>Gross Earnings</td>
                                <td class="amt-col">${fmt(grossEarnings)}</td>
                                <td>Total Deductions</td>
                                <td class="amt-col">${fmt(totalDeductions)}</td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- Net Pay (matches Excel row 25) -->
                    <div class="ps-net-row">
                        <div>
                            <div class="ps-net-label">NET PAY (Take Home)</div>
                            <div class="ps-net-words">${amtWords} Only</div>
                        </div>
                        <div class="ps-net-amount">₹ ${fmt(netPay)}</div>
                    </div>

                    <div class="ps-footer">
                        This is a Computer Generated Payslip and does not require Signature.<br>
                        For any discrepancies, please contact HR department within 7 days.
                    </div>

                </div>`;

            document.getElementById('payslipContent').innerHTML = content;
            document.getElementById('payslipModal').classList.add('active');
        }

        // ── Download PDF (original logic kept) ─────────────────────────────
        function downloadPayslipPDF() {
            const element = document.getElementById('payslipToPrint');
            if (!element) return;

            const safeName  = (currentPayslipData?.name  || 'Employee').replace(/\s+/g, '_');
            const safeMonth = (currentPayslipData?.monthRaw || '').replace('-', '_');

            const opt = {
                margin: [0.5, 0.5, 0.5, 0.5],
                filename: `Salary_Slip_${safeName}_${safeMonth}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save()
                .then(() => showToast('Payslip downloaded successfully!', 'success'))
                .catch(() => showToast('Error generating PDF!', 'error'));
        }

        // ── Print (original logic kept) ─────────────────────────────────────
        function printPayslip() {
            const printContents = document.getElementById('payslipToPrint').innerHTML;
            const originalContents = document.body.innerHTML;
            document.body.innerHTML = printContents;
            window.print();
            document.body.innerHTML = originalContents;
            window.location.reload();
        }

        // ── Filter cards (original logic kept) ─────────────────────────────
        function filterPayslips() {
            const search      = document.getElementById('payslipSearch').value.toLowerCase().trim();
            const selectedEmp = document.getElementById('payslipEmployee').value.toLowerCase();
            const cards       = document.querySelectorAll('.payslip-card');

            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                const id   = card.getAttribute('data-id').toLowerCase();
                let show   = true;

                if (search && !name.includes(search)) show = false;
                if (selectedEmp !== 'all' && id !== selectedEmp && name !== selectedEmp) show = false;

                card.style.display = show ? 'block' : 'none';
            });
        }

        // ── Close modal (original) ──────────────────────────────────────────
        function closePayslipModal() {
            document.getElementById('payslipModal').classList.remove('active');
        }

        // ── Helpers ─────────────────────────────────────────────────────────
        function getSelectedMonthLabel() {
            const val = document.getElementById('payslipMonth').value; // YYYY-MM
            if (!val) return '—';
            const [y, m] = val.split('-');
            const months = ['January', 'February', 'March', 'April', 'May', 'June',
                            'July', 'August', 'September', 'October', 'November', 'December'];
            return `${months[parseInt(m, 10) - 1]} ${y}`;
        }

        function numberToWords(num) {
            const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten',
                'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

            function convertToWords(n) {
                if (n === 0) return 'Zero';
                if (n < 20) return ones[n];
                if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + ones[n % 10] : '');
                if (n < 1000) return ones[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + convertToWords(n % 100) : '');
                if (n < 100000) return convertToWords(Math.floor(n / 1000)) + ' Thousand' + (n % 1000 ? ' ' + convertToWords(n % 1000) : '');
                if (n < 10000000) return convertToWords(Math.floor(n / 100000)) + ' Lakh' + (n % 100000 ? ' ' + convertToWords(n % 100000) : '');
                return convertToWords(Math.floor(n / 10000000)) + ' Crore' + (n % 10000000 ? ' ' + convertToWords(n % 10000000) : '');
            }
            return convertToWords(num);
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

    </script>
</body>
